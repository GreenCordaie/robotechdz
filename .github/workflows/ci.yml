# CI pipeline pour 100-pc-IA / Robotech Admin / FLEXBOX DIRECT
#
# Garanties :
#   - Postgres + Redis isolés via services Docker GitHub (pas de prod touchée)
#   - TOUTES les clés externes (LoadBrain, Telegram, WhatsApp, Microsoft, Groq)
#     sont VIDES → services court-circuitent → ZÉRO credit consommé
#   - Aucune écriture vers la DB prod ni vers le VPS Hostinger
#   - Aucun deploy déclenché (deploy.yml est sur master/avant-netflix-n8n
#     uniquement et ce workflow n'y push pas)
#
# Trigger : push + pull_request sur master, avant-netflix-n8n, epic-** et feat-**
# Concurrence : annule les runs précédents sur la même branche pour économiser
# les minutes GitHub Actions.

name: CI

on:
  push:
    branches:
      - master
      - avant-netflix-n8n
      - 'epic-**'
      - 'feat/**'
  pull_request:
    branches:
      - master
      - avant-netflix-n8n
      - 'epic-**'
      - 'feat/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-lint:
    name: Typecheck + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pack LoadBrain stubs into expected tgz paths
        # Le package.json référence ../LoadBrain/dist-packages/*.tgz (privés, non
        # commités). En CI on remplace par des stubs no-op du repo qui satisfont
        # juste les imports statiques. Le code applicatif n'appelle JAMAIS ces
        # SDK quand LOADBRAIN_API_KEY est vide (cas du CI).
        run: bash scripts/ci-pack-loadbrain-stubs.sh
      - name: Install deps (no lock — stubs have different sha than real LoadBrain tgz)
        # On retire package-lock.json en CI car les stubs LoadBrain ont un hash
        # différent du vrai SDK référencé dans le lock. npm ci ferait fail avec
        # EINTEGRITY. npm install régénère un lock éphémère sans toucher au commit.
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript strict (NO ignoreBuildErrors)
        run: npx tsc --noEmit
      - name: ESLint (warnings allowed, errors fail)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=999 || true

  build-check:
    name: Production build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck-and-lint
    # Pourquoi : tsc strict catche les erreurs de typage MAIS pas les crashs au
    # "collecting page data" (rendu statique des routes). Sans ce job, des bugs
    # type "validateConfig au module-load avec env vide" ou "<html> dupliqué dans
    # une page App Router" cassent le build prod sans qu'on le sache avant deploy.
    services:
      # Postgres requis : pendant le static render, le root layout exécute
      # generateMetadata/generateViewport qui font des queries Drizzle vers
      # shop_settings. Sans DB joignable → Export errors sur toutes les pages.
      # On schéma-push avant le build pour avoir une DB à jour.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pc_ia_test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d pc_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Env figé — toutes clés vides → court-circuit → 0 credit consommé.
      # Le build doit fonctionner même sans creds (les routes lazy-init au runtime).
      NODE_ENV: production
      DATABASE_URL: postgres://testuser:testpass@localhost:5499/pc_ia_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci_build_session_secret_NEVER_USE_IN_PROD
      ENCRYPTION_KEY: ci_build_encryption_key_NEVER_USE_IN_PROD
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      TURNSTILE_SECRET_KEY: ""
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_SECRET_TOKEN: ""
      WHATSAPP_API_URL: ""
      WHATSAPP_API_KEY: ""
      WHATSAPP_VERIFY_TOKEN: ""
      LOADBRAIN_API_KEY: ""
      LOADBRAIN_URL: ""
      LOADBRAIN_SITE_URL: ""
      LOADBRAIN_WEBHOOK_SECRET: ""
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      MICROSOFT_REDIRECT_URI: ""
      GROQ_API_KEY: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: mailto:build@ci.local
      CRON_SECRET: ci_build_cron_secret
      PRINT_SECRET: ci_build_print_secret
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_ENDPOINT: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_URL: ""
      NEXT_PUBLIC_APP_URL: http://localhost:1556
      ENABLE_DEBUG_ROUTES: "false"
      N8N_CALLBACK_SECRET: ci_n8n_secret
      N8N_WEBHOOK_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pack LoadBrain stubs into expected tgz paths
        run: bash scripts/ci-pack-loadbrain-stubs.sh
      - name: Install deps (inclure devDeps malgré NODE_ENV=production)
        # `NODE_ENV=production` au niveau du job fait que npm install skip
        # les devDependencies par défaut. Or tailwindcss / postcss / autoprefixer
        # sont en devDeps mais REQUIS au build (next/font les charge). On force
        # --include=dev pour les avoir.
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund --include=dev
      - name: Wait for postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5499 -U testuser -d pc_ia_test; then
              echo "postgres ready"; break
            fi
            sleep 1
          done
        env:
          PGPASSWORD: testpass
      - name: Apply schema (drizzle-kit push)
        run: npx drizzle-kit push --force
      - name: next build (strict — ignoreBuildErrors=false + ignoreDuringBuilds=false)
        # Doit passer SANS aucune env externe configurée. Si une route crashe
        # au module-load ou au "collecting page data" sans creds, c'est un bug
        # qui doit être fixé (typiquement : init lazy au lieu de top-level).
        run: npm run build

  e2e-tests:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pc_ia_test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d pc_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6499:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Env figé pour ce job — pas de credit consommé.
      # Toutes les clés externes sont vides → court-circuit dans le code.
      NODE_ENV: development
      DATABASE_URL: postgres://testuser:testpass@localhost:5499/pc_ia_test
      REDIS_URL: redis://localhost:6499
      SESSION_SECRET: ci_session_secret_e2e_only_NEVER_USE_IN_PROD_xxx
      ENCRYPTION_KEY: ci_encryption_key_e2e_only_NEVER_USE_IN_PROD_xxx
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      TURNSTILE_SECRET_KEY: ""
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_SECRET_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      WHATSAPP_API_URL: ""
      WHATSAPP_API_KEY: ""
      WHATSAPP_SESSION: ""
      WHATSAPP_WEBHOOK_SECRET: ""
      WHATSAPP_VERIFY_TOKEN: ""
      N8N_CALLBACK_SECRET: ci_n8n_secret_xxx
      N8N_WEBHOOK_URL: ""
      LOADBRAIN_API_KEY: ""
      LOADBRAIN_BASE_URL: ""
      LOADBRAIN_SITE_URL: ""
      LOADBRAIN_WEBHOOK_SECRET: ci_loadbrain_webhook_secret_xxx
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      MICROSOFT_REDIRECT_URI: ""
      GROQ_API_KEY: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: mailto:test@ci.local
      CRON_SECRET: ci_cron_secret_xxx
      PRINT_SECRET: ci_print_secret_xxx
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_ENDPOINT: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_URL: ""
      NEXT_PUBLIC_APP_URL: http://localhost:4555
      ENABLE_DEBUG_ROUTES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pack LoadBrain stubs into expected tgz paths
        run: bash scripts/ci-pack-loadbrain-stubs.sh

      - name: Install deps (no lock — stubs have different sha than real LoadBrain tgz)
        # On retire package-lock.json en CI car les stubs LoadBrain ont un hash
        # différent du vrai SDK référencé dans le lock. npm ci ferait fail avec
        # EINTEGRITY. npm install régénère un lock éphémère sans toucher au commit.
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Wait for postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5499 -U testuser -d pc_ia_test; then
              echo "postgres ready"; break
            fi
            sleep 1
          done
        env:
          PGPASSWORD: testpass

      - name: Apply schema (drizzle-kit push)
        run: npx drizzle-kit push --force

      - name: Seed E2E fixtures
        run: npx tsx scripts/seed-e2e.ts

      - name: Start Next.js dev server
        run: |
          npx next dev -p 4555 > /tmp/dev-server.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV

      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4555/ > /dev/null 2>&1; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"
          cat /tmp/dev-server.log
          exit 1

      - name: Run Playwright E2E
        run: npx playwright test --reporter=list,html

      - name: Stop dev server
        if: always()
        run: kill ${{ env.DEV_PID }} || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/dev-server.log
          retention-days: 7
          if-no-files-found: ignore
