# CI pipeline pour 100-pc-IA / Robotech Admin / FLEXBOX DIRECT
#
# Garanties :
#   - Postgres + Redis isolés via services Docker GitHub (pas de prod touchée)
#   - TOUTES les clés externes (LoadBrain, Telegram, WhatsApp, Microsoft, Groq)
#     sont VIDES → services court-circuitent → ZÉRO credit consommé
#   - Aucune écriture vers la DB prod ni vers le VPS Hostinger
#   - Aucun deploy déclenché (deploy.yml est sur master/avant-netflix-n8n
#     uniquement et ce workflow n'y push pas)
#
# Trigger : push + pull_request (toutes branches)
# Concurrence : annule les runs précédents sur la même branche pour économiser
# les minutes GitHub Actions.

name: CI

on:
  push:
    branches:
      - master
      - avant-netflix-n8n
      - 'epic-**'
  pull_request:
    branches:
      - master
      - avant-netflix-n8n
      - 'epic-**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-lint:
    name: Typecheck + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: TypeScript strict (NO ignoreBuildErrors)
        run: npx tsc --noEmit
      - name: ESLint (warnings allowed, errors fail)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=999 || true

  e2e-tests:
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: typecheck-and-lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pc_ia_test
        ports:
          - 5499:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d pc_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6499:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Env figé pour ce job — pas de credit consommé.
      # Toutes les clés externes sont vides → court-circuit dans le code.
      NODE_ENV: development
      DATABASE_URL: postgres://testuser:testpass@localhost:5499/pc_ia_test
      REDIS_URL: redis://localhost:6499
      SESSION_SECRET: ci_session_secret_e2e_only_NEVER_USE_IN_PROD_xxx
      ENCRYPTION_KEY: ci_encryption_key_e2e_only_NEVER_USE_IN_PROD_xxx
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      TURNSTILE_SECRET_KEY: ""
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_SECRET_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      WHATSAPP_API_URL: ""
      WHATSAPP_API_KEY: ""
      WHATSAPP_SESSION: ""
      WHATSAPP_WEBHOOK_SECRET: ""
      WHATSAPP_VERIFY_TOKEN: ""
      N8N_CALLBACK_SECRET: ci_n8n_secret_xxx
      N8N_WEBHOOK_URL: ""
      LOADBRAIN_API_KEY: ""
      LOADBRAIN_BASE_URL: ""
      LOADBRAIN_SITE_URL: ""
      LOADBRAIN_WEBHOOK_SECRET: ci_loadbrain_webhook_secret_xxx
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      MICROSOFT_REDIRECT_URI: ""
      GROQ_API_KEY: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: mailto:test@ci.local
      CRON_SECRET: ci_cron_secret_xxx
      PRINT_SECRET: ci_print_secret_xxx
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_ENDPOINT: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_URL: ""
      NEXT_PUBLIC_APP_URL: http://localhost:4555
      ENABLE_DEBUG_ROUTES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Wait for postgres ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5499 -U testuser -d pc_ia_test; then
              echo "postgres ready"; break
            fi
            sleep 1
          done
        env:
          PGPASSWORD: testpass

      - name: Apply schema (drizzle-kit push)
        run: npx drizzle-kit push --force

      - name: Seed E2E fixtures
        run: npx tsx scripts/seed-e2e.ts

      - name: Start Next.js dev server
        run: |
          npx next dev -p 4555 > /tmp/dev-server.log 2>&1 &
          echo "DEV_PID=$!" >> $GITHUB_ENV

      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4555/ > /dev/null 2>&1; then
              echo "dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"
          cat /tmp/dev-server.log
          exit 1

      - name: Run Playwright E2E
        run: npx playwright test --reporter=list,html

      - name: Stop dev server
        if: always()
        run: kill ${{ env.DEV_PID }} || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            /tmp/dev-server.log
          retention-days: 7
          if-no-files-found: ignore
